name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          python-version: "3.12"
      - run: uv sync --locked --all-groups
      - run: uv run pytest -q

  docker:
    name: Docker build + stdio conformance (linux/amd64)
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Resolve image version
        id: meta
        run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: percival-notes-mcp:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Inspect identity and privilege posture
        run: |
          test "$(docker image inspect percival-notes-mcp:ci --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect percival-notes-mcp:ci --format '{{.Config.User}}')" = 65532:65532
          test "$(docker image inspect percival-notes-mcp:ci --format '{{json .Config.Healthcheck}}')" = null
          test "$(docker image inspect percival-notes-mcp:ci --format '{{index .Config.Labels \"org.opencontainers.image.revision\"}}')" = "$GITHUB_SHA"
      - name: MCP stdio conformance (offline, no TTY or ports)
        run: >-
          python3 scripts/docker-ci-conformance.py
          --image percival-notes-mcp:ci
          --mount type=tmpfs,destination=/vault,tmpfs-mode=0777
          --expected-uid 65532
          --expected-tool notes_get_status
          --compose-service percival-notes
      - name: Render Compose contract
        env:
          NOTES_VAULT_HOST_PATH: ${{ runner.temp }}/vault
        run: docker compose config --quiet
      - name: Write build manifest
        run: python3 scripts/write_docker_ci_manifest.py --image percival-notes-mcp:ci --source-sha "$GITHUB_SHA" --lock uv.lock --lock uv-bootstrap-requirements.lock --output docker-build-manifest.json
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: percival-notes-mcp:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: docker-evidence-notes-${{ github.sha }}
          path: |
            docker-build-manifest.json
            sbom.cdx.json
          if-no-files-found: error
