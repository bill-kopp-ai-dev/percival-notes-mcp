# Notes MCP is stdio-only. The vault is the sole persistent writable mount;
# point NOTES_VAULT_HOST_PATH at an existing directory owned/writable by
# UID/GID 65532:65532 (or grant that identity an ACL).
# Run: docker compose run --rm -T percival-notes

services:
  percival-notes:
    build:
      context: .
      dockerfile: Dockerfile
    image: percival-notes-mcp:dev
    init: true
    stdin_open: true
    tty: false
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - type: bind
        source: ${NOTES_VAULT_HOST_PATH:-${HOME}/.local/share/percival-notes/vault}
        target: /vault
        bind:
          create_host_path: false
